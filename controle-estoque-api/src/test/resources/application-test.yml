spring:
  application:
    name: controle-estoque-api-test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  data:
    redis:
      host: localhost
      port: 6379


api:
  security:
    token:
      secret: teste-secret-key-123456


logging:
  level:
    org.hibernate.SQL: OFF